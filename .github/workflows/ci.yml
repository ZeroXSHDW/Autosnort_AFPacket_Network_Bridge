name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bash syntax check
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
            count=$((count + 1))
          done < <(find . -type f -name '*.sh' ! -path './.git/*' -print0 | sort -z)
          if [[ $count -eq 0 ]]; then
            echo "No shell scripts found"
            exit 1
          fi
          echo "All $count scripts passed bash -n"

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends shellcheck

      - name: ShellCheck maintained installer
        run: shellcheck --severity=warning -- ZeroXSHDW_autosnort-ubuntu.sh
